<!doctype html>
<!-- The social card (assets/img/og.png): render with headless Chrome at 1200x630, reduced motion, e.g.
     "Google Chrome" --headless --force-prefers-reduced-motion --window-size=1200,630 --screenshot=og.png http://127.0.0.1:8781/tools/og.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  .og canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .og .inner { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
  .og img { width: 104px; }
  .og h1 { margin-top: 26px; font-size: 68px; font-weight: 420; line-height: 1.06; letter-spacing: -0.03em; }
  .og p { margin-top: 20px; font-size: 25px; color: var(--text-2); }
  .og small { margin-top: 26px; font-size: 18px; color: var(--muted); }
</style>
</head>
<body>
<div class="og">
  <canvas class="hero-field"></canvas>
  <div class="inner">
    <img class="crow-mark" src="../assets/img/crow-mark.png" alt="">
    <h1>Build your second brain<br>in minutes</h1>
    <p>Turn your documents into a living wiki you can chat with.</p>
    <small>Crow · free and open source · macOS, Windows, Linux</small>
  </div>
</div>
<script type="module" src="../assets/js/site.js"></script>
</body>
</html>
